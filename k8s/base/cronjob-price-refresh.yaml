apiVersion: batch/v1
kind: CronJob
metadata:
  name: investmentology-price-refresh
  namespace: investmentology
  labels:
    app.kubernetes.io/name: investmentology
    app.kubernetes.io/component: price-refresh
spec:
  # Mon-Fri 14:30, 16:00, 17:30, 19:00, 20:30 UTC (market hours)
  schedule: "30 14,16,17,19,20 * * 1-5"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: investmentology
            app.kubernetes.io/component: price-refresh
        spec:
          restartPolicy: OnFailure
          containers:
            - name: price-refresh
              image: ghcr.io/charlieshreck/investmentology-api:latest
              command: ["/bin/sh", "-c"]
              args:
              - |
                RUN_ID=$(python3 -c "
                import json, urllib.request
                try:
                    req = urllib.request.Request('http://estate-triage.kernow.io/api/automation/preflight',
                        data=json.dumps({'name':'invest-price-refresh','tenant_id':'kernow','triggered_by':'cronjob'}).encode(),
                        headers={'Content-Type':'application/json'}, method='POST')
                    resp = urllib.request.urlopen(req, timeout=5)
                    print(json.loads(resp.read()).get('run_id',''))
                except: print('')
                " 2>/dev/null)
                python3 -m investmentology cron price-refresh
                EXIT=$?
                [ -n "$RUN_ID" ] && python3 -c "
                import json, urllib.request
                try:
                    req = urllib.request.Request('http://estate-triage.kernow.io/api/automation/complete',
                        data=json.dumps({'run_id':int('$RUN_ID'),'exit_code':$EXIT,'tenant_id':'kernow'}).encode(),
                        headers={'Content-Type':'application/json'}, method='POST')
                    urllib.request.urlopen(req, timeout=10)
                except: pass
                " 2>/dev/null || true
                exit $EXIT
              envFrom:
                - secretRef:
                    name: investmentology-secrets
              env:
                - name: QUANT_GATE_TOP_N
                  value: "100"
                - name: MIN_MARKET_CAP
                  value: "200000000"
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
