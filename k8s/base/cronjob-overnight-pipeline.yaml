apiVersion: batch/v1
kind: CronJob
metadata:
  name: investmentology-overnight-pipeline
  namespace: investmentology
  labels:
    app.kubernetes.io/name: investmentology
    app.kubernetes.io/component: overnight-pipeline
spec:
  # 01:00 UTC Tue-Sat (Mon-Fri market days)
  schedule: "0 1 * * 2-6"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # 5 hour max (pipeline can be slow with 30+ tickers and CLI agents)
      activeDeadlineSeconds: 18000
      ttlSecondsAfterFinished: 86400  # GC Failed/Completed jobs after 24h
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: investmentology
            app.kubernetes.io/component: overnight-pipeline
        spec:
          restartPolicy: Never
          containers:
            - name: overnight
              image: ghcr.io/charlieshreck/investmentology-api:latest
              command: ["/bin/sh", "-c"]
              args:
              - |
                RUN_ID=$(python3 -c "
                import json, urllib.request
                try:
                    req = urllib.request.Request('http://estate-triage.kernow.io/api/automation/preflight',
                        data=json.dumps({'name':'invest-overnight-pipeline','tenant_id':'kernow','triggered_by':'cronjob'}).encode(),
                        headers={'Content-Type':'application/json'}, method='POST')
                    resp = urllib.request.urlopen(req, timeout=5)
                    print(json.loads(resp.read()).get('run_id',''))
                except: print('')
                " 2>/dev/null)
                python3 -m investmentology cron overnight-pipeline
                EXIT=$?
                [ -n "$RUN_ID" ] && python3 -c "
                import json, urllib.request
                try:
                    req = urllib.request.Request('http://estate-triage.kernow.io/api/automation/complete',
                        data=json.dumps({'run_id':int('$RUN_ID'),'exit_code':$EXIT,'tenant_id':'kernow'}).encode(),
                        headers={'Content-Type':'application/json'}, method='POST')
                    urllib.request.urlopen(req, timeout=10)
                except: pass
                " 2>/dev/null || true
                exit $EXIT
              envFrom:
                - secretRef:
                    name: investmentology-secrets
              env:
                - name: QUANT_GATE_TOP_N
                  value: "100"
                - name: MIN_MARKET_CAP
                  value: "200000000"
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "200m"
                limits:
                  memory: "1Gi"
                  cpu: "1000m"
