apiVersion: batch/v1
kind: CronJob
metadata:
  name: investmentology-daily-monitor
  namespace: investmentology
  labels:
    app.kubernetes.io/name: investmentology
    app.kubernetes.io/component: daily-monitor
spec:
  # Mon-Fri 20:15 UTC (16:15 ET) — post-market daily monitoring
  schedule: "15 20 * * 1-5"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400  # GC Failed/Completed jobs after 24h
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: investmentology
            app.kubernetes.io/component: daily-monitor
        spec:
          restartPolicy: OnFailure
          containers:
            - name: daily-monitor
              image: ghcr.io/charlieshreck/investmentology-api:latest
              command: ["/bin/sh", "-c"]
              args:
              - |
                RUN_ID=$(python3 -c "
                import json, urllib.request
                try:
                    req = urllib.request.Request('http://estate-triage.kernow.io/api/automation/preflight',
                        data=json.dumps({'name':'invest-daily-monitor','tenant_id':'kernow','triggered_by':'cronjob'}).encode(),
                        headers={'Content-Type':'application/json'}, method='POST')
                    resp = urllib.request.urlopen(req, timeout=5)
                    print(json.loads(resp.read()).get('run_id',''))
                except: print('')
                " 2>/dev/null)
                python3 -m investmentology cron daily-monitor
                EXIT=$?
                [ -n "$RUN_ID" ] && python3 -c "
                import json, urllib.request
                try:
                    req = urllib.request.Request('http://estate-triage.kernow.io/api/automation/complete',
                        data=json.dumps({'run_id':int('$RUN_ID'),'exit_code':$EXIT,'tenant_id':'kernow'}).encode(),
                        headers={'Content-Type':'application/json'}, method='POST')
                    urllib.request.urlopen(req, timeout=10)
                except: pass
                " 2>/dev/null || true
                exit $EXIT
              envFrom:
                - secretRef:
                    name: investmentology-secrets
              env:
                - name: QUANT_GATE_TOP_N
                  value: "100"
                - name: MIN_MARKET_CAP
                  value: "200000000"
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
